[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-agent"
version = "1.0.0"
description = "Agente de atendimento da Empório da Música"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pdfplumber>=0.11",
  "openai>=1.40",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".agents",
  ".claude",
  ".reversa",
  ".venv",
  "_reversa_sdd",
  "_reversa_forward",
  "emporio_musica",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
